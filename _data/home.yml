thrusts:
  - icon: layers
    title: Accelerators for post-quantum &amp; verifiable computing
    body: >-
      NTT, sum-check, and hash-chain kernels mapped onto Versal AI Engines and edge GPUs
      so zkSNARKs, FHE, and XMSS run within an embedded power budget.
    venues: DAC · DATE · PACT · ICCD
  - icon: chip
    title: Roots of trust &amp; side channels
    body: >-
      Power, electromagnetic, and timing leakage in NTT and lattice hardware. Fault
      injection against hash-based post-quantum signatures, and the countermeasures
      that survive it.
    venues: HOST · AsianHOST · GOMACTech
  - icon: radar
    title: Secure autonomy &amp; transportation
    body: >-
      LiDAR spoofing against SLAM, ROS 2 attack surfaces, CAN-bus exploitation, and the
      cyberinfrastructure that trains the next automotive security workforce.
    venues: HOST · MOST · NSF CyberTraining

